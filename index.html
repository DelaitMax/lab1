<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Fast Food Simulator</title>
	</head>
	<body class="min-h-screen bg-slate-50 text-slate-900">
		<main class="mx-auto max-w-6xl space-y-5 p-4 sm:p-6">
			<header>
				<h1 class="text-2xl font-bold">Fast Food Simulator</h1>
			</header>

			<!-- Настройки -->
			<section class="rounded-lg border border-slate-200 bg-white p-4">
				<div class="grid gap-5 sm:grid-cols-3">
					<div>
						<label class="block text-sm font-medium text-slate-700"
							>Интервал прихода клиентов, сек</label
						>
						<input
							id="arrival"
							value="2"
							inputmode="decimal"
							class="mt-1 w-28 rounded border border-slate-300 px-2 py-1 disabled:bg-slate-100"
						/>
					</div>

					<div>
						<label class="block text-sm font-medium text-slate-700">Количество касс</label>
						<input
							id="cashier-count"
							type="number"
							min="1"
							max="6"
							value="1"
							class="mt-1 w-20 rounded border border-slate-300 px-2 py-1 disabled:bg-slate-100"
						/>
						<div id="cashier-settings" class="mt-3 space-y-1.5"></div>
					</div>

					<div>
						<label class="block text-sm font-medium text-slate-700">Количество поваров</label>
						<input
							id="cook-count"
							type="number"
							min="1"
							max="6"
							value="3"
							class="mt-1 w-20 rounded border border-slate-300 px-2 py-1 disabled:bg-slate-100"
						/>
						<div id="cook-settings" class="mt-3 space-y-1.5"></div>
					</div>
				</div>

				<ul
					id="errors"
					class="mt-4 hidden list-disc space-y-1 rounded bg-red-50 p-3 pl-7 text-sm text-red-700"
				></ul>

				<div class="mt-4 flex gap-3">
					<button
						id="start"
						class="rounded bg-emerald-600 px-4 py-1.5 font-medium text-white hover:bg-emerald-700 disabled:opacity-40"
					>
						Start
					</button>
					<button
						id="stop"
						class="rounded bg-slate-700 px-4 py-1.5 font-medium text-white hover:bg-slate-800 disabled:opacity-40"
						disabled
					>
						Stop
					</button>
				</div>
			</section>

			<!-- Живая картина симуляции -->
			<div class="grid gap-4 lg:grid-cols-4">
				<section class="rounded-lg border border-slate-200 bg-white p-4">
					<h2 class="font-semibold text-slate-800">Очередь к кассам</h2>
					<p class="mt-1 text-sm text-slate-500">Ждут: <b id="order-line-count">0</b></p>
					<div id="order-line-dots" class="mt-3 min-h-10"></div>
				</section>

				<section class="rounded-lg border border-slate-200 bg-white p-4">
					<h2 class="font-semibold text-slate-800">Кассы</h2>
					<div id="cashier-grid" class="mt-3 space-y-2"></div>
				</section>

				<section class="rounded-lg border border-slate-200 bg-white p-4">
					<h2 class="font-semibold text-slate-800">Кухня</h2>
					<p class="mt-1 text-sm text-slate-500">
						В очереди на готовку: <b id="kitchen-count">0</b>
					</p>
					<div id="kitchen-tickets" class="mt-2 min-h-8"></div>
					<div id="cook-grid" class="mt-3 space-y-2"></div>
				</section>

				<section class="rounded-lg border border-slate-200 bg-white p-4">
					<h2 class="font-semibold text-slate-800">Выдача</h2>
					<p class="mt-1 text-sm text-slate-500">Готов к выдаче:</p>
					<div id="pickup" class="mt-2"></div>
					<p class="mt-4 text-sm text-slate-500">Ждут свой заказ: <b id="serving-count">0</b></p>
					<div id="serving-dots" class="mt-2 min-h-6"></div>
				</section>
			</div>
		</main>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
